name: ML Engine Check

# ml/ had no CI at all. That is why an unused dependency carrying a security
# advisory (scikit-learn) sat in requirements.txt unnoticed, and why nothing
# would have caught a requirements change that broke the import graph.
#
# Deliberately small: install the pinned requirements on the SAME Python the
# Dockerfile uses (3.11-slim), then import the app. That proves the pins resolve
# together and every module-level import in main.py is satisfied — which is
# exactly the class of breakage a requirements edit causes.

on:
  pull_request:
    branches: [main]
    paths:
      - 'ml/**'
      - '.github/workflows/ml-check.yml'
  push:
    branches: [main]
    paths:
      - 'ml/**'
  workflow_dispatch:

jobs:
  imports:
    name: Install pins + import the app (py3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Must match ml/Dockerfile.ml (`FROM python:3.11-slim`). pandas==2.1.4
      # predates 3.12 and has no wheel for newer interpreters, so a mismatch
      # here fails for reasons that have nothing to do with the change.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ml/requirements.txt

      - name: Install pinned requirements
        run: pip install -r ml/requirements.txt

      - name: Import the FastAPI app
        working-directory: ml
        run: python -c "import main; print('imported', main.app.title, main.app.version)"

      - name: Report anything installed but never imported
        working-directory: ml
        # Advisory only. A pin can be legitimately unimported — numpy is,
        # because PyPortfolioOpt requires numpy<2.0.0 — so this warns rather
        # than fails.
        #
        # Resolve the real MODULE name from installed metadata instead of
        # guessing from the package name. They differ often enough that guessing
        # produces false alarms (PyPortfolioOpt imports as `pypfopt`), and a
        # check that cries wolf is a check people learn to ignore.
        run: |
          python - <<'PY'
          import re, pathlib
          from importlib.metadata import packages_distributions

          src = "\n".join(p.read_text() for p in pathlib.Path(".").glob("*.py"))
          imported = set(re.findall(r"^\s*(?:import|from)\s+([A-Za-z0-9_]+)", src, re.M))

          # module -> [distribution]; invert to distribution -> {modules}
          dist_modules = {}
          for mod, dists in packages_distributions().items():
              for d in dists:
                  dist_modules.setdefault(d.lower(), set()).add(mod)

          for line in pathlib.Path("requirements.txt").read_text().splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              pkg = re.split(r"[=<>\[;]", line)[0].strip()
              mods = dist_modules.get(pkg.lower(), {pkg.lower().replace("-", "_")})
              if not (mods & imported):
                  print(f"::warning::{pkg} is pinned but never imported "
                        f"(module{'s' if len(mods) > 1 else ''}: {', '.join(sorted(mods))})")
          PY
