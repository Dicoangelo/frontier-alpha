<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Google Fonts: Inter + JetBrains Mono (Metaventions AI typography) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet" />

    <link rel="icon" type="image/svg+xml" href="/brand/metaventions-ai-mark.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/brand/metaventions-ai-logo.png" />
    <link rel="canonical" href="https://frontier-alpha.metaventionsai.com/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f1f4f7" />
    <meta name="description" content="Understand your portfolio, explore factor exposures, and review risk with clear analytics and plain-language explanations from Frontier Alpha." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Frontier Alpha" />

    <!-- Open Graph / Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Metaventions AI" />
    <meta property="og:url" content="https://frontier-alpha.metaventionsai.com" />
    <meta property="og:title" content="Frontier Alpha | Metaventions AI" />
    <meta property="og:description" content="Understand your portfolio, explore factor exposures, and review risk with clear analytics and plain-language explanations." />
    <meta property="og:image" content="https://frontier-alpha.metaventionsai.com/brand/metaventions-ai-logo.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Frontier Alpha | Metaventions AI" />
    <meta name="twitter:description" content="Understand your portfolio, explore factor exposures, and review risk with clear analytics and plain-language explanations." />
    <meta name="twitter:image" content="https://frontier-alpha.metaventionsai.com/brand/metaventions-ai-logo.png" />

    <title>Frontier Alpha | Metaventions AI</title>
    <script>
      try {
        const preference = JSON.parse(localStorage.getItem('frontier-theme') || 'null')?.state?.theme;
        if (preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch { /* A fresh workspace starts in light mode. */ }
    </script>
    <style>
      /* Critical CSS for reduced layout shift */
      html { -webkit-text-size-adjust: 100%; }
      body { margin: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      #root { min-height: 100vh; }

      /* Focus visible styles (global) */
      :focus-visible {
        outline: 2px solid #176b96;
        outline-offset: 2px;
      }

      /* Reduced motion preference */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* Screen reader only utility */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* Initial loading state */
      .app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f1f4f7;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      .app-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .app-loader-spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #d7e0e7;
        border-top-color: #176b96;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .app-loader-text {
        margin-top: 16px;
        font-size: 13px;
        color: #4f6475;
        font-weight: 500;
        font-family: inherit;
      }
      .dark .app-loader { background: #101923; }
      .dark .app-loader-text { color: #b7c8d6; }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- Initial loader - hidden when React mounts -->
    <div id="app-loader" class="app-loader">
      <div class="app-loader-spinner"></div>
      <p class="app-loader-text">Loading Frontier Alpha...</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
